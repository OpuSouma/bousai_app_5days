<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --header-blue: #1a6cca;
      --header-blue-dark: #1a6cca;
      --text-blue: #0b5ea8;
      --soft-bg: #edf0f2;
      --panel-bg: #f3f5f6;
      --panel-border: #dfe4e6;
      --muted-text: #6f7a82;
      --text-main: #1f2f3d;
      --success: #2ca56a;
      --shadow: 0 4px 14px rgba(18, 48, 74, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--soft-bg);
      color: var(--text-main);
      font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 9999;
      width: 100%;
      height: 68px;
      background: linear-gradient(180deg, var(--header-blue) 0%, var(--header-blue-dark) 100%);
      box-shadow: 0 2px 8px rgba(11, 35, 62, 0.15);
    }

    .site-header-inner {
      max-width: 1200px;
      height: 100%;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-title {
      margin: 0;
      font-size: clamp(1.8rem, 2vw, 2.3rem);
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.02em;
    }

    .hamburger-wrap {
      position: relative;
    }

    .menu-toggle {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 8px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .menu-toggle:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .menu-toggle-line {
      position: relative;
      display: block;
      width: 24px;
      height: 3px;
      border-radius: 2px;
      background: #fff;
    }

    .menu-toggle-line::before,
    .menu-toggle-line::after {
      content: "";
      position: absolute;
      left: 0;
      width: 24px;
      height: 3px;
      border-radius: 2px;
      background: #fff;
    }

    .menu-toggle-line::before { top: -8px; }
    .menu-toggle-line::after { top: 8px; }

    .header-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      display: none;
      flex-direction: column;
      min-width: 220px;
      padding: 10px 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 10px 25px rgba(12, 25, 40, 0.18);
      border: 1px solid rgba(16, 62, 108, 0.1);
    }

    .header-menu.open {
      display: flex;
    }

    .header-menu a {
      padding: 12px 18px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1.02rem;
      font-weight: 600;
      border-bottom: 1px solid #edf0f2;
    }

    .header-menu a:last-child {
      border-bottom: none;
    }

    .header-menu a:hover {
      background: #f4f7fb;
    }

    main {
      width: 100%;
      padding: 28px 16px 40px;
    }

    .page-shell {
      max-width: 820px;
      margin: 0 auto;
    }

    .success-toast {
      position: fixed;
      top: 84px;
      right: 24px;
      z-index: 10000;
      padding: 14px 22px;
      border-radius: 8px;
      background: var(--success);
      color: #fff;
      font-weight: 700;
      box-shadow: var(--shadow);
      animation: success-toast-fade 0.5s ease 2s forwards;
    }

    @keyframes success-toast-fade {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    .shelter-register-form {
      width: 100%;
      margin: 24px auto 0;
      padding: 24px;
      border-radius: 16px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
    }

    .shelter-register-form > p {
      margin: 0 0 20px;
    }

    .shelter-register-form input[type="text"],
    .shelter-register-form select {
      width: 100%;
      max-width: 480px;
      min-height: 42px;
      margin-top: 6px;
      padding: 8px 10px;
      border: 1px solid #cbd3d8;
      border-radius: 6px;
      background: #fff;
      color: var(--text-main);
      font: inherit;
    }

    .shelter-register-form input[type="checkbox"] {
      margin-right: 4px;
    }

    .shelter-register-form .register-confirm-button {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 1000;
      min-width: 100px;
      min-height: 52px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: var(--header-blue);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .shelter-register-form .register-confirm-button:hover {
      background: var(--text-blue);
    }

    @media (max-width: 640px) {
      .shelter-register-form {
        padding: 18px;
      }

      .shelter-register-form .register-confirm-button {
        right: 16px;
        bottom: 16px;
      }
    }

    .section-box {
      background: transparent;
      border-radius: 18px;
      margin-bottom: 24px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
      font-size: clamp(1.1rem, 1.5vw, 1.8rem);
      font-weight: 700;
      color: var(--text-blue);
    }

    .pin-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      color: var(--text-blue);
      font-size: 1.4rem;
      line-height: 1;
    }

    .map-card {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      background: #eef3f5;
      border-radius: 16px;
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    #shelterMap {
      width: 100%;
      height: 380px;
      background: #dfeef7;
    }

    .weather-panel {
      width: 100%;
      max-width: 820px;
      margin: 28px auto 0;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px 22px;
    }

    .weather-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #dde2e6;
      margin-bottom: 14px;
    }

    .weather-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(1.1rem, 1.6vw, 1.7rem);
      font-weight: 700;
      color: var(--text-blue);
    }

    .weather-refresh {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: var(--success);
      font-weight: 600;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .weather-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: var(--text-main);
      font-size: 1rem;
    }

    .weather-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 28px;
      color: var(--text-main);
      font-size: 1rem;
    }

    .weather-row .bullet {
      width: 10px;
      height: 10px;
      display: inline-block;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
    }

    .weather-row strong {
      color: var(--text-main);
    }

    .weather-row .subtle {
      color: var(--muted-text);
      font-size: 0.95rem;
    }

    :focus-visible {
      outline: 3px solid #d47b00;
      outline-offset: 3px;
    }

    .shelter-search-form,
    .all-shelters-link,
    .applied-conditions,
    .shelter-result-card,
    .form-errors,
    .empty-state {
      margin: 20px 0;
      padding: 20px;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: var(--panel-bg);
      box-shadow: var(--shadow);
    }

    .shelter-search-form > p {
      margin: 0 0 20px;
    }

    .shelter-search-form label:not(.search-checkbox),
    .shelter-search-form small {
      display: block;
    }

    .shelter-search-form input[type="search"],
    .shelter-search-form select {
      display: block;
      width: 100%;
      min-height: 48px;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid #8998a2;
      border-radius: 6px;
      background: #fff;
      color: var(--text-main);
      font: inherit;
    }

    .shelter-search-form small {
      margin-top: 6px;
      color: #4c5961;
    }

    .shelter-search-form fieldset,
    .shelter-register-form fieldset {
      margin: 0 0 20px;
      padding: 12px;
      border: 1px solid #b6c0c6;
      border-radius: 8px;
    }

    .search-checkbox {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      margin-right: 16px;
      cursor: pointer;
    }

    .search-checkbox input {
      width: 20px;
      height: 20px;
    }

    .shelter-search-button,
    .shelter-clear-button,
    .all-shelters-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .shelter-search-button {
      width: 100%;
      min-height: 60px;
      background: var(--header-blue);
      color: #fff;
    }

    .shelter-search-button:hover {
      background: var(--text-blue);
    }

    .shelter-clear-button {
      width: 100%;
      margin-top: 10px;
      border: 1px solid #596872;
      background: #fff;
      color: var(--text-main);
    }

    .all-shelters-link {
      text-align: center;
    }

    .all-shelters-button {
      min-width: 200px;
      border: 2px solid var(--header-blue);
      background: #fff;
      color: var(--text-blue);
    }

    .shelter-results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 16px;
      margin: 20px 0;
      padding: 0;
      list-style: none;
    }

    .shelter-result-card {
      margin: 0;
    }

    .shelter-result-details {
      display: grid;
      grid-template-columns: minmax(110px, 0.8fr) minmax(0, 1.5fr);
      gap: 10px 14px;
      margin: 0;
    }

    .shelter-result-details dt {
      font-weight: 700;
    }

    .shelter-result-details dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .shelter-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
    }

    .shelter-status--green {
      background: #d8f3df;
      color: #14532d;
    }

    .shelter-status--yellow {
      background: #fff1b8;
      color: #654d00;
    }

    .shelter-status--orange {
      background: #ffe0c2;
      color: #7c2d12;
    }

    .shelter-status--red {
      background: #fee2e2;
      color: #7f1d1d;
    }

    .shelter-status--neutral {
      background: #e5e7eb;
      color: #374151;
    }

    .shelter-amenities {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .shelter-amenities li {
      padding: 4px 8px;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      background: #fff;
    }

    .shelter-result-card h3,
    .all-shelters-link h3,
    .applied-conditions h3 {
      margin-top: 0;
      color: var(--text-blue);
    }

    .shelter-result-card p:last-child {
      margin-bottom: 0;
    }

    .form-errors {
      border-color: #b42318;
      color: #8a1c13;
    }

    .form-errors p:first-child {
      margin-top: 0;
    }

    .form-errors p:last-child {
      margin-bottom: 0;
    }

    .results-navigation {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 24px;
    }

    .results-button {
      display: inline-flex;
      flex: 1 1 220px;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 12px 18px;
      border: 2px solid var(--header-blue);
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }

    .results-button--primary {
      background: var(--header-blue);
      color: #fff;
    }

    .results-button--secondary {
      background: #fff;
      color: var(--text-blue);
    }

    .empty-state .results-button {
      margin-top: 8px;
    }

    @media (max-width: 480px) {
      .shelter-result-details {
        grid-template-columns: minmax(0, 1fr);
        gap: 4px;
      }

      .shelter-result-details dd {
        margin-bottom: 10px;
      }
    }

    @media (max-width: 640px) {
      .site-header {
        height: 60px;
      }

      .site-title {
        font-size: 1.7rem;
      }

      .weather-panel {
        padding: 16px 16px 18px;
      }

      #shelterMap {
        height: 300px;
      }

      .shelter-search-form,
      .all-shelters-link,
      .applied-conditions,
      .shelter-result-card,
      .form-errors,
      .empty-state {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <h1 class="site-title">防災アプリ</h1>

      <div class="hamburger-wrap">
        <button class="menu-toggle" type="button" aria-label="メニューを開く" aria-expanded="false">
          <span class="menu-toggle-line"></span>
        </button>

        <nav class="header-menu" aria-label="メインメニュー">
          <a href="/">ホーム</a>
          <a href="/shelter_search">避難所検索</a>
          <a href="/shelter_register">避難所登録</a>
          <a href="/board">指示・発信ボード</a>
          {% if session.logged_in %}
            <a href="/logout">ログアウト</a>
          {% else %}
            <a href="/login">ログイン</a>
          {% endif %}
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="page-shell">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const toggle = document.querySelector('.menu-toggle');
      const menu = document.querySelector('.header-menu');
      if (!toggle || !menu) return;

      toggle.addEventListener('click', function () {
        const isOpen = menu.classList.toggle('open');
        toggle.setAttribute('aria-expanded', String(isOpen));
      });

      document.addEventListener('click', function (event) {
        if (!menu.contains(event.target) && !toggle.contains(event.target)) {
          menu.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        }
      });
    });
  </script>
</body>
</html>
