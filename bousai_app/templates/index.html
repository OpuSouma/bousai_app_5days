{% extends "base.html" %}

{% block content %}
<div class="section-box">
  <h2 class="section-title"><span class="pin-icon">📍</span>避難所マップ</h2>
  <div class="map-card">
    <div id="shelterMap"></div>
  </div>
</div>

<div class="weather-panel">
  <div class="weather-header">
    <div class="weather-title">
      <span class="pin-icon">⚠️</span>
      <span>青森市 気象警報・注意報</span>
    </div>
    <button class="weather-refresh" type="button" aria-label="更新">
      <span>⟳</span>
      <span>10分おき自動更新</span>
    </button>
  </div>

  <div id="weatherContent" class="weather-body">
    <div class="weather-row"><span class="bullet"></span><span>読み込み中...</span></div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap', {
        zoomControl: true,
        dragging: true,
        scrollWheelZoom: true
    }).setView([40.8244, 140.7400], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                updateWeatherContent(data);
            })
            .catch(() => {
                document.getElementById('weatherContent').innerHTML = `
                    <div class="weather-row"><span class="bullet"></span><span>気象情報の取得に失敗しました</span></div>
                `;
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = `
                <div class="weather-row"><span class="bullet"></span><span>気象情報の取得に失敗しました</span></div>
            `;
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = data.warnings.map(warning => {
                return `
                    <div class="weather-row">
                        <span class="bullet"></span>
                        <span><strong>${warning.name}</strong>（${warning.status}）</span>
                    </div>
                `;
            }).join('');
        } else {
            warningsHtml = `
                <div class="weather-row">
                    <span class="bullet"></span>
                    <span>現在、警報・注意報は発表されていません</span>
                </div>
            `;
        }

        weatherContent.innerHTML = `
            <div class="weather-row"><span class="bullet"></span><span><strong>対象地域:</strong> ${data.area_name || '青森市'}</span></div>
            ${warningsHtml}
            <div class="weather-row"><span class="bullet" style="background:#6d7b84"></span><span class="subtle">最終確認: ${data.last_fetch_time || '更新中...'}</span></div>
            <div class="weather-row"><span class="bullet" style="background:#6d7b84"></span><span class="subtle">気象庁最終発表: ${data.report_time || '不明'}</span></div>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
